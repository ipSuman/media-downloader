name: Fix VP9 FFmpeg and Progress

on:
  push:
    branches: [youtube-quality-fallback]
    paths:
      - '.github/workflows/fix-vp9-progress.yml'

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: youtube-quality-fallback

      - name: Patch VP9 FFmpeg resolver, progress, and build workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt')
          s = engine.read_text()

          old = '''    private fun resolveBundledFfmpeg(root: File): File? {
        if (!root.exists()) return null
        val preferred = listOf(
            File(root, "usr/bin/ffmpeg"),
            File(root, "usr/lib/ffmpeg"),
            File(root, "ffmpeg")
        )
        preferred.firstOrNull { it.isFile }?.let { return it }
        return root.walkTopDown().firstOrNull { it.isFile && it.name == "ffmpeg" }
    }
'''
          new = '''    private fun resolveBundledFfmpeg(root: File): File? {
        val nativeDir = File(context.applicationInfo.nativeLibraryDir)
        val preferred = listOf(
            File(nativeDir, "libffmpeg.so"),
            File(root, "usr/bin/ffmpeg"),
            File(root, "usr/lib/ffmpeg"),
            File(root, "ffmpeg")
        )
        preferred.firstOrNull { it.isFile && it.canRead() }?.let { return it }
        if (root.exists()) {
            root.walkTopDown().firstOrNull { it.isFile && it.name == "ffmpeg" }?.let { return it }
        }
        nativeDir.listFiles()?.firstOrNull { it.isFile && it.name.equals("libffmpeg.so", true) }?.let { return it }
        return null
    }
'''
          if old not in s:
              raise SystemExit('FFmpeg resolver block not found')
          s = s.replace(old, new, 1)

          old = '            val ffmpeg = resolveBundledFfmpeg(ffmpegRoot)\n            if (ffmpeg == null) {\n                val entries = ffmpegRoot.walkTopDown().take(80).joinToString(",") { it.relativeTo(ffmpegRoot).path }\n                throw IllegalStateException("Bundled FFmpeg executable not found under ${ffmpegRoot.absolutePath}; entries=$entries")\n            }\n            ffmpeg.setExecutable(true, false)\n            val output = File(dir, "${videoFile.name.substringBeforeLast('.')}.webm")\n            val libDir = File(ffmpegRoot, "usr/lib")\n'
          new = '            val ffmpeg = resolveBundledFfmpeg(ffmpegRoot)\n            if (ffmpeg == null) {\n                val entries = if (ffmpegRoot.exists()) ffmpegRoot.walkTopDown().take(80).joinToString(",") { it.relativeTo(ffmpegRoot).path } else "<ffmpeg package root missing>"\n                val nativeEntries = File(context.applicationInfo.nativeLibraryDir).listFiles()?.joinToString(",") { it.name } ?: "<none>"\n                throw IllegalStateException("Bundled FFmpeg executable not found; root=${ffmpegRoot.absolutePath}; entries=$entries; nativeLibs=$nativeEntries")\n            }\n            ffmpeg.setExecutable(true, false)\n            val output = File(dir, "${videoFile.name.substringBeforeLast('.')}.webm")\n            val libDir = ffmpeg.parentFile ?: File(context.applicationInfo.nativeLibraryDir)\n'
          if old not in s:
              raise SystemExit('FFmpeg call block not found')
          s = s.replace(old, new, 1)

          old = '''            put("percent", progress.toInt().coerceIn(0, 100))
'''
          new = '''            val safeProgress = progress.toInt().coerceIn(0, 100)
            put("percent", if (state == "completed") 100 else safeProgress.coerceAtMost(99))
'''
          if old not in s:
              raise SystemExit('progress writer block not found')
          s = s.replace(old, new, 1)

          old = '''            log("FFmpeg executable resolved: ${ffmpeg.absolutePath}")
            log("FFmpeg concat started")
'''
          new = '''            log("FFmpeg executable resolved: ${ffmpeg.absolutePath}")
            log("FFmpeg executable exists=${ffmpeg.exists()} executable=${ffmpeg.canExecute()} size=${ffmpeg.length()}")
            log("FFmpeg concat started")
'''
          if old not in s:
              raise SystemExit('FFmpeg logging block not found')
          s = s.replace(old, new, 1)

          engine.write_text(s)

          index = Path('index.html')
          j = index.read_text()

          old = '''    if(data.percent != null){

      bar.style.width =
        `${Math.max(
          0,
          Math.min(
            100,
            Number(data.percent)
          )
        )}%`;

    }


    status.textContent =
      `${data.status || "working"}`
      + (data.speed
        ? ` • ${data.speed}`
        : "")
      + (data.eta
        ? ` • ETA ${data.eta}`
        : "");
'''
          new = '''    const terminal =
      data.status === "completed" ||
      data.status === "failed" ||
      data.status === "cancelled";

    const rawPercent = Number(data.percent);
    const percent = Number.isFinite(rawPercent)
      ? Math.max(0, Math.min(terminal && data.status === "completed" ? 100 : 99, rawPercent))
      : 0;

    bar.style.width = `${percent}%`;

    status.textContent =
      `${terminal && data.status === "completed" ? "completed" : (data.status || "working")} • ${percent}%`
      + (data.speed ? ` • ${data.speed}` : "")
      + (data.eta ? ` • ETA ${data.eta}` : "");
'''
          if old not in j:
              raise SystemExit('frontend progress block not found')
          j = j.replace(old, new, 1)
          index.write_text(j)

          workflow = Path('.github/workflows/android-build.yml')
          w = workflow.read_text()
          old = '''      - name: Apply YouTube quality fallback patch
        run: python3 scripts/patch-youtube-quality.py

      - name: Commit patched source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt app/src/main/assets/download-fix.js
            git commit -m "Handle YouTube quality with cookie fallback [skip ci]"
            git push origin HEAD:youtube-quality-fallback
          fi

'''
          if old in w:
              w = w.replace(old, '', 1)
          workflow.write_text(w)

          print('VP9 FFmpeg resolver, progress handling, and build workflow fixed')
          PY

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt index.html .github/workflows/android-build.yml
          git commit -m "Fix VP9 FFmpeg path and download progress"
          git push origin HEAD:youtube-quality-fallback

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-youtube-quality-fallback-fixed
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-vp9-progress.yml || true
          git commit -m "Remove temporary VP9 fix workflow" || true
          git push origin HEAD:youtube-quality-fallback || true
