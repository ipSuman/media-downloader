name: Apply YouTube PO Token Fix

on:
  workflow_dispatch:
  push:
    branches:
      - youtube-quality-fallback
    paths:
      - 'scripts/apply-po-token-fix.py'
      - 'app/src/main/java/com/ipsuman/mediadownloader/YoutubePoTokenProvider.kt'
      - '.github/workflows/apply-vp9-fix2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: youtube-quality-fallback
          fetch-depth: 0
      - name: Apply YouTube PO-token patch and cleanup
        run: python3 scripts/apply-po-token-fix.py
      - name: Verify LocalEngineServer Kotlin source
        run: |
          if grep -q 'val videoCodec = req.optString("video_codec", "").trim()$' app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt && \
             [ "$(grep -c 'val videoCodec = req.optString("video_codec", "").trim()' app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt)" -eq 1 ]; then
            echo 'videoCodec declaration is clean'
          else
            echo 'Duplicate videoCodec declaration detected'
            exit 1
          fi
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt app/src/main/java/com/ipsuman/mediadownloader/YoutubePoTokenProvider.kt scripts/apply-po-token-fix.py
          if git diff --cached --quiet; then echo 'No source changes required'; exit 0; fi
          git commit -m 'Clean YouTube PO token integration source'
          git push origin youtube-quality-fallback
