name: Fix terminate click

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch terminate handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/download-fix.js')
          s = p.read_text()
          old = '      if (isCancel && !confirm("Terminate this download? The partial file will be discarded.")) return;\n'
          new = '      if (isCancel) console.log("Media Downloader: terminate click", { jobId });\n'
          if old not in s:
              raise SystemExit('terminate confirmation line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- app/src/main/assets/download-fix.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/download-fix.js
          git commit -m "fix: make terminate control direct"
          git push origin main
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-terminate-click.yml
          git commit -m "chore: remove temporary terminate patch workflow"
          git push origin main
