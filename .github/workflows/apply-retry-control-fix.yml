name: Apply retry control fix

on:
  push:
    branches: [fix-control-bridge]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-control-bridge
          fetch-depth: 0
      - name: Apply retry control patch
        run: python3 scripts/fix_retry_control.py
      - name: Remove patch helper
        run: |
          rm -f scripts/fix_retry_control.py .github/workflows/apply-retry-control-fix.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt .github/workflows scripts
          git commit -m "fix: allow pause and terminate during cookie retry"
          git push origin fix-control-bridge
