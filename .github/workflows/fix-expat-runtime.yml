name: Fix Expat runtime

on:
  push:
    branches:
      - youtube-quality-fallback
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Expat packaging and runtime lookup
        shell: python
        run: |
          from pathlib import Path

          # Android's native library packaging expects an ABI library named
          # *.so. The previous *.so.1 file was not being placed in
          # nativeLibraryDir, so the runtime copy never had a source file.
          wf = Path('.github/workflows/android-build.yml')
          s = wf.read_text()
          old = "cp -L \"$EXPAT_LIB\" app/src/main/jniLibs/arm64-v8a/libexpat.so.1"
          new = "cp -L \"$EXPAT_LIB\" app/src/main/jniLibs/arm64-v8a/libexpat.so"
          if old not in s:
              raise SystemExit('Expected Expat packaging line not found')
          s = s.replace(old, new, 1)
          s = s.replace('ls -l app/src/main/jniLibs/arm64-v8a/libexpat.so.1', 'ls -l app/src/main/jniLibs/arm64-v8a/libexpat.so', 1)
          wf.write_text(s)

          # The source library in nativeLibraryDir will now be libexpat.so.
          # Copy it to the FFmpeg extraction directory under the SONAME that
          # libfontconfig requests: libexpat.so.1.
          for name in [
              'app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt',
              'app/src/main/java/com/ipsuman/mediadownloader/YoutubePoTokenProvider.kt',
          ]:
              p = Path(name)
              text = p.read_text()
              text = text.replace('nativeLibraryDir, "libexpat.so.1"', 'nativeLibraryDir, "libexpat.so"')
              text = text.replace('nativeLibDirForFfmpeg(), "libexpat.so.1"', 'nativeLibDirForFfmpeg(), "libexpat.so"')
              p.write_text(text)

          # Add a runtime diagnostic immediately before FFmpeg starts. This
          # makes the next log unambiguous: source and target path + sizes.
          p = Path('app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt')
          text = p.read_text()
          marker = '            log("FFmpeg concat started")'
          insertion = '''            val expatSource = File(context.applicationInfo.nativeLibraryDir, "libexpat.so")
            val expatTarget = File(libDir, "libexpat.so.1")
            log("FFmpeg Expat source: ${expatSource.absolutePath} exists=${expatSource.isFile} size=${expatSource.length()}")
            log("FFmpeg Expat target: ${expatTarget.absolutePath} exists=${expatTarget.isFile} size=${expatTarget.length()}")
            if (!expatTarget.isFile || expatTarget.length() == 0L) {
                throw IllegalStateException("FFmpeg dependency libexpat.so.1 is missing from ${libDir.absolutePath}")
            }
'''
          if marker not in text:
              raise SystemExit('FFmpeg concat marker not found')
          if 'FFmpeg Expat source:' not in text:
              text = text.replace(marker, insertion + marker, 1)
          p.write_text(text)

      - name: Commit permanent fix and remove patch workflow
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android-build.yml app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt app/src/main/java/com/ipsuman/mediadownloader/YoutubePoTokenProvider.kt
          git rm .github/workflows/fix-expat-runtime.yml
          git commit -m "Fix Android Expat packaging for FFmpeg linker"
          git push
