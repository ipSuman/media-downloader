name: Fix job controls

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LocalEngineServer job control
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt')
          s = p.read_text()

          if 'private val jobWorkerLocks = ConcurrentHashMap<String, Any>()' not in s:
              s = s.replace(
                  'private val executor = Executors.newCachedThreadPool()\n',
                  'private val executor = Executors.newCachedThreadPool()\n    private val jobWorkerLocks = ConcurrentHashMap<String, Any>()\n',
                  1)

          old = '''    private fun runJob(jobId: String) {
        val dir = jobs[jobId] ?: return
        val request = jobRequests[jobId] ?: return
        try {
            ensureEngine()
            jobStates[jobId] = "running"
            writeProgress(dir, "starting", 0.0, null, "Starting download…")
'''
          new = '''    private fun runJob(jobId: String) {
        val lock = jobWorkerLocks.computeIfAbsent(jobId) { Any() }
        synchronized(lock) {
            runJobLocked(jobId)
        }
    }

    private fun runJobLocked(jobId: String) {
        val dir = jobs[jobId] ?: return
        val request = jobRequests[jobId] ?: return
        try {
            // Do not resurrect a job that was paused/cancelled before its worker started.
            val stateBeforeEngine = jobStates[jobId] ?: return
            if (stateBeforeEngine != "running") return
            ensureEngine()
            // Pause/terminate may have arrived while the engine was initializing.
            if (jobStates[jobId] != "running") return
            writeProgress(dir, "starting", 0.0, null, "Starting download…")
'''
          if old not in s:
              raise SystemExit('runJob start pattern not found')
          s = s.replace(old, new, 1)

          old_cleanup = '''        jobRequests.remove(jobId)
        jobCookieRequests.remove(jobId)
        jobStates.remove(jobId)
'''
          new_cleanup = '''        jobRequests.remove(jobId)
        jobCookieRequests.remove(jobId)
        jobStates.remove(jobId)
        jobWorkerLocks.remove(jobId)
'''
          if old_cleanup not in s:
              raise SystemExit('cleanup pattern not found')
          s = s.replace(old_cleanup, new_cleanup, 1)

          p.write_text(s)

          # Verify the structural change before committing.
          text = p.read_text()
          required = [
              'private val jobWorkerLocks = ConcurrentHashMap<String, Any>()',
              'private fun runJob(jobId: String)',
              'private fun runJobLocked(jobId: String)',
              'if (jobStates[jobId] != "running") return',
              'jobWorkerLocks.remove(jobId)'
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'missing required patch: {item}')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt .github/workflows/fix-job-controls.yml
          git commit -m "Fix pause terminate and resume race" || true
          git push
          git rm .github/workflows/fix-job-controls.yml
          git commit -m "Remove temporary job control patch workflow"
          git push
