name: Android Build

on:
  push:
    branches:
      - youtube-quality-fallback
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply VP9 and progress fixes
        run: python3 scripts/fix-vp9-progress.py

      - name: Commit repaired source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt index.html
            git commit -m "Fix VP9 FFmpeg path and download progress"
            git push origin HEAD:youtube-quality-fallback
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-youtube-quality-fallback-fixed
          path: app/build/outputs/apk/debug/app-debug.apk
