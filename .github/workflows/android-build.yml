name: Android Release Build

on:
  push:
    branches:
      - main
      - fix-control-bridge
      - material-you
      - v0.3-notifications
      - po-token-hardening
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4
        env:
          GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/media-downloader-release.jks"
          test -s "$RUNNER_TEMP/media-downloader-release.jks"

      - name: Apply source-aligned hardening
        run: python3 scripts/apply-po-token-fix.py

      - name: Apply download/authentication hardening
        run: python3 scripts/apply-download-hardening.py

      - name: Enforce cookie-only final fallback
        run: python3 scripts/apply-cookie-fallback-fix.py

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Sign Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/MediaDownloader-v0.3-dev.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/media-downloader-release.jks" \
            --ks-key-alias media-downloader \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"
          test -s "$SIGNED_APK"
          rm -f "$APK"
          rm -f "$RUNNER_TEMP/media-downloader-release.jks"

      - name: Upload Signed v0.3 Development APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-v0.3-dev-signed
          path: app/build/outputs/apk/release/MediaDownloader-v0.3-dev.apk
          if-no-files-found: error
