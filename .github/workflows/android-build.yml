name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good engine source
        run: |
          git show 3e02a6a89fe0f48b768d66f0e3f0b7b03536c221:app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt > app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt
          if ! git diff --quiet -- app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt
            git commit -m "Restore known-good engine server source [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
