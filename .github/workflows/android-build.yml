name: Android Build

on:
  push:
    branches:
      - main
      - fix-download-race
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate source
        run: |
          git diff --check
          test -s app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt
          test -s app/src/main/java/com/ipsuman/mediadownloader/MainActivity.kt
          test -s index.html

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
