name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4
        env:
          GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125"

      - name: Build and package Android Expat runtime
        shell: bash
        run: |
          set -euo pipefail
          EXPAT_VERSION="2.8.2"
          EXPAT_TAG="R_2_8_2"
          mkdir -p .ci/expat

          EXPAT_URLS=(
            "https://codeload.github.com/libexpat/libexpat/tar.gz/refs/tags/${EXPAT_TAG}"
            "https://downloads.sourceforge.net/project/expat/expat/${EXPAT_VERSION}/expat-${EXPAT_VERSION}.tar.gz"
          )

          downloaded="false"
          for url in "${EXPAT_URLS[@]}"; do
            echo "Downloading Expat from: ${url}"
            if curl --fail --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 180 \
              --connect-timeout 20 --max-time 300 \
              "$url" -o .ci/expat/expat.tar.gz; then
              downloaded="true"
              break
            fi
            echo "Download failed; trying the next official source."
            rm -f .ci/expat/expat.tar.gz
          done

          test "$downloaded" = "true"
          test -s .ci/expat/expat.tar.gz

          tar -xzf .ci/expat/expat.tar.gz -C .ci/expat

          # The codeload archive uses the Git tag as its directory name
          # (libexpat-R_2_8_2), while the SourceForge archive uses the version
          # name (expat-2.8.2). Discover the source tree instead of assuming
          # either naming convention.
          EXPAT_SOURCE="$(find .ci/expat \
            -mindepth 2 -maxdepth 2 \
            -type f -name CMakeLists.txt \
            -printf '%h\n' | head -n 1)"
          test -n "$EXPAT_SOURCE"
          echo "Using Expat source: $EXPAT_SOURCE"

          cmake -S "$EXPAT_SOURCE" \
            -B .ci/expat/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DEXPAT_SHARED_LIBS=ON \
            -DEXPAT_BUILD_TOOLS=OFF \
            -DEXPAT_BUILD_EXAMPLES=OFF \
            -DEXPAT_BUILD_TESTS=OFF \
            -DEXPAT_BUILD_DOCS=OFF \
            -DEXPAT_BUILD_FUZZERS=OFF \
            -DEXPAT_BUILD_PKGCONFIG=OFF \
            -DEXPAT_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/.ci/expat/install"

          cmake --build .ci/expat/build --target expat -j2
          cmake --install .ci/expat/build

          mkdir -p app/src/main/jniLibs/arm64-v8a
          EXPAT_LIB="$(find .ci/expat/install -name 'libexpat.so*' -type f | head -n 1)"
          test -n "$EXPAT_LIB"
          cp -L "$EXPAT_LIB" app/src/main/jniLibs/arm64-v8a/libexpat.so.1
          ls -l app/src/main/jniLibs/arm64-v8a/libexpat.so.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-youtube-quality-fallback-fixed
          path: app/build/outputs/apk/debug/app-debug.apk
