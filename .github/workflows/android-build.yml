name: Android Build

on:
  push:
    branches:
      - youtube-quality-fallback
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4
        env:
          GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125"

      - name: Build and package Android Expat runtime
        shell: bash
        run: |
          set -euo pipefail
          EXPAT_VERSION="2.8.2"
          EXPAT_TAG="R_2_8_2"
          mkdir -p .ci/expat
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://github.com/libexpat/libexpat/releases/download/${EXPAT_TAG}/expat-${EXPAT_VERSION}.tar.gz" \
            -o .ci/expat/expat.tar.gz
          tar -xzf .ci/expat/expat.tar.gz -C .ci/expat
          cmake -S ".ci/expat/expat-${EXPAT_VERSION}" \
            -B .ci/expat/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DEXPAT_SHARED_LIBS=ON \
            -DEXPAT_BUILD_TOOLS=OFF \
            -DEXPAT_BUILD_EXAMPLES=OFF \
            -DEXPAT_BUILD_TESTS=OFF \
            -DEXPAT_BUILD_DOCS=OFF \
            -DEXPAT_BUILD_FUZZERS=OFF \
            -DEXPAT_BUILD_PKGCONFIG=OFF \
            -DEXPAT_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/.ci/expat/install"
          cmake --build .ci/expat/build --target expat -j2
          cmake --install .ci/expat/build
          mkdir -p app/build/generated/jniLibs/arm64-v8a
          EXPAT_LIB="$(find .ci/expat/install -name 'libexpat.so*' -type f | head -n 1)"
          test -n "$EXPAT_LIB"
          cp -L "$EXPAT_LIB" app/build/generated/jniLibs/arm64-v8a/libexpat.so.1
          ls -l app/build/generated/jniLibs/arm64-v8a/libexpat.so.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-youtube-quality-fallback-fixed
          path: app/build/outputs/apk/debug/app-debug.apk
