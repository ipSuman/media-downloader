name: Apply terminate fix

on:
  push:
    branches: [youtube-quality-fallback]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch terminate handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/download-fix.js')
          s = p.read_text()
          old = '''    cancel.onclick = async () => {
      if (!confirm("Terminate this download? The partial file will be discarded.")) return;
      cancel.disabled = true;
      try { await controlJob(jobId, "cancel"); } catch (e) { cancel.disabled = false; alert(e.message || "Terminate failed"); }
    };'''
          new = '''    cancel.onclick = async () => {
      cancel.disabled = true;
      pause.disabled = true;
      const status = item.querySelector(".queue-status");
      if (status) status.textContent = "⛔ Terminating…";
      try {
        await controlJob(jobId, "cancel");
        if (status) status.textContent = "⛔ Terminated";
        controls.style.display = "none";
      } catch (e) {
        cancel.disabled = false;
        pause.disabled = false;
        if (status) status.textContent = "⚠ Terminate failed";
        alert(e.message || "Terminate failed");
      }
    };'''
          if old not in s:
              raise SystemExit('terminate handler not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/download-fix.js
          git commit -m "Fix Android WebView terminate button"
          git rm .github/workflows/apply-terminate-fix.yml
          git commit -m "Remove temporary terminate workflow"
          git push
