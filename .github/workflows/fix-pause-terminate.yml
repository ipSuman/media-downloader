name: Fix pause and terminate process control

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LocalEngineServer control path
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt")
          s = p.read_text()

          old = '''            ensureEngine()\n            jobStates[jobId] = "running"\n            writeProgress(dir, "starting", 0.0, null, "Starting download…")'''
          new = '''            ensureEngine()\n            val stateBeforeStart = jobStates[jobId]\n            if (stateBeforeStart == "paused" || stateBeforeStart == "cancelled") {\n                log("Download $jobId start suppressed because state is $stateBeforeStart")\n                return\n            }\n            jobStates[jobId] = "running"\n            writeProgress(dir, "starting", 0.0, null, "Starting download…")'''
          if old not in s:
              raise SystemExit("runJob start block not found")
          s = s.replace(old, new, 1)

          count = s.count('YoutubeDL.getInstance().destroyProcessById(id)')
          if count < 2:
              raise SystemExit(f"Expected 2 control destroy calls, found {count}")
          s = s.replace('YoutubeDL.getInstance().destroyProcessById(id)', 'forceStopJobProcess(id)', 2)

          marker = '    private fun controlDownload(id: String, action: String): Response {'
          if marker not in s:
              raise SystemExit("controlDownload marker not found")

          helper = '''    private fun forceStopJobProcess(jobId: String) {\n        var libraryStopped = false\n        try {\n            libraryStopped = YoutubeDL.getInstance().destroyProcessById(jobId)\n            log("yt-dlp library stop for $jobId: $libraryStopped")\n        } catch (e: Exception) {\n            log("yt-dlp library stop failed for $jobId", e)\n        }\n\n        try {\n            val rootPid = android.os.Process.myPid()\n            val parentByPid = HashMap<Int, Int>()\n            val commandByPid = HashMap<Int, String>()\n            for (entry in File("/proc").listFiles().orEmpty()) {\n                val pid = entry.name.toIntOrNull() ?: continue\n                try {\n                    val ppid = File(entry, "status").readLines()\n                        .firstOrNull { it.startsWith("PPid:") }\n                        ?.substringAfter(":")?.trim()?.toIntOrNull() ?: continue\n                    parentByPid[pid] = ppid\n                    val cmd = File(entry, "cmdline").readBytes()\n                        .toString(Charsets.UTF_8).replace('\\u0000', ' ').trim()\n                    if (cmd.isNotEmpty()) commandByPid[pid] = cmd\n                } catch (_: Exception) { }\n            }\n\n            val roots = commandByPid.entries\n                .filter { (pid, cmd) ->\n                    pid != rootPid &&\n                        (cmd.contains("libpython.so", ignoreCase = true) ||\n                         cmd.contains("yt-dlp", ignoreCase = true))\n                }\n                .map { it.key }.toSet()\n\n            fun belongsToRoot(pid: Int): Boolean {\n                var current = pid\n                val seen = HashSet<Int>()\n                while (current != rootPid && seen.add(current)) {\n                    if (current in roots) return true\n                    current = parentByPid[current] ?: return false\n                }\n                return false\n            }\n\n            val targets = parentByPid.keys.filter { belongsToRoot(it) }\n                .sortedByDescending { it }\n            for (pid in targets) {\n                try {\n                    android.os.Process.killProcess(pid)\n                    log("Killed download process pid=$pid for job $jobId")\n                } catch (e: Exception) {\n                    log("Could not kill download process pid=$pid for job $jobId", e)\n                }\n            }\n            if (targets.isEmpty() && !libraryStopped) {\n                log("No yt-dlp process found for job $jobId")\n            }\n        } catch (e: Exception) {\n            log("Fallback process scan failed for job $jobId", e)\n        }\n    }\n\n'''
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          final = p.read_text()
          assert final.count('forceStopJobProcess(id)') >= 2
          assert 'stateBeforeStart' in final
          assert 'YoutubeDL.getInstance().destroyProcessById(id)' not in final
          PY

      - name: Commit source patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt
          git rm .github/workflows/fix-pause-terminate.yml
          git commit -m "Fix pause and terminate process control"
          git push origin HEAD:main
