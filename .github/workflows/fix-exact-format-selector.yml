name: Fix exact format selector
on:
  push:
    branches: [youtube-quality-fallback]
    paths:
      - '.github/workflows/fix-exact-format-selector.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: youtube-quality-fallback
      - name: Patch Android injection
        run: |
          sed -i 's/"cut-keyboard-fix.js")/"cut-keyboard-fix.js", "download-fix.js")/' app/src/main/java/com/ipsuman/mediadownloader/MainActivity.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ipsuman/mediadownloader/MainActivity.kt
          git commit -m 'Load exact format download bridge'
          git push origin youtube-quality-fallback
