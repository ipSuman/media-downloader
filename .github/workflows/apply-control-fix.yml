name: Apply control fix

on:
  push:
    branches: [fix-control-bridge]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-control-bridge
          fetch-depth: 0
      - name: Apply source patch
        env:
          PATCH_B64: "CmltcG9ydCBiYXNlNjQK" 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/control_patch.py
          python3 /tmp/control_patch.py
      - name: Remove temporary patch workflows
        run: |
          rm -f .github/workflows/patch-control-bridge.yml .github/workflows/repair-control-patch-runner.yml .github/workflows/apply-control-fix.yml
      - name: Verify
        run: |
          grep -q 'controlDownload(jobId: String, action: String, requestId: String)' app/src/main/java/com/ipsuman/mediadownloader/MainActivity.kt
          grep -q 'CONTROL HTTP request received' app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt
          grep -q '__mdControlClickHandlerInstalled' app/src/main/assets/download-fix.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/download-fix.js app/src/main/java/com/ipsuman/mediadownloader/MainActivity.kt app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt .github/workflows
          git commit -m "fix: make pause terminate use native control bridge"
          git push origin fix-control-bridge
