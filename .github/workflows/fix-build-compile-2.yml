name: Fix Build Compile 2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove every stale FFmpeg process-map reference
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt"
          test -f "$FILE"
          # The manual FFmpeg process map is gone. Remove only its remaining
          # stale call sites; preserve all other application logic unchanged.
          sed -i '/ffmpegProcesses/d' "$FILE"
          if grep -n 'ffmpegProcesses' "$FILE"; then
            echo 'Unexpected ffmpegProcesses reference remains.'
            exit 1
          fi

      - name: Commit source cleanup and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-build-compile.yml
          rm -f .github/workflows/fix-build-compile-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt .github/workflows/fix-build-compile.yml .github/workflows/fix-build-compile-2.yml
          git commit -m "Remove remaining stale FFmpeg process references"
          git push
