name: Fix FFmpeg runtime resolver

on:
  push:
    branches: [youtube-quality-fallback]
    paths:
      - '.github/workflows/fix-ffmpeg-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: youtube-quality-fallback
          fetch-depth: 0

      - name: Patch FFmpeg resolver and output path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt')
          s = p.read_text()

          old = '''    private fun resolveBundledFfmpeg(root: File): File? {
        val nativeDir = File(context.applicationInfo.nativeLibraryDir)
        val preferred = listOf(
            File(nativeDir, "libffmpeg.so"),
            File(root, "usr/bin/ffmpeg"),
            File(root, "usr/lib/ffmpeg"),
            File(root, "ffmpeg")
        )
        preferred.firstOrNull { it.isFile && it.canRead() }?.let { return it }
        if (root.exists()) {
            root.walkTopDown().firstOrNull { it.isFile && it.name == "ffmpeg" }?.let { return it }
        }
        return nativeDir.listFiles()?.firstOrNull { it.isFile && it.name.equals("libffmpeg.so", true) }
    }
'''
          new = '''    private fun resolveBundledFfmpeg(root: File): File? {
        // youtubedl-android's FFmpeg module extracts the ZIP payload into
        // noBackupFilesDir/youtubedl-android/packages/ffmpeg.  The native
        // libffmpeg.zip.so is the ZIP container, not the executable itself.
        // Prefer the extracted executable so Android's linker can resolve the
        // bundled libav*.so dependencies from the same package.
        val preferred = listOf(
            File(root, "usr/bin/ffmpeg"),
            File(root, "usr/lib/ffmpeg"),
            File(root, "ffmpeg")
        )
        preferred.firstOrNull { it.isFile && it.canRead() }?.let { return it }
        if (root.exists()) {
            root.walkTopDown().firstOrNull {
                it.isFile && it.name == "ffmpeg" && it.canRead()
            }?.let { return it }
        }
        return null
    }
'''
          if old not in s:
              raise SystemExit('resolver block not found')
          s = s.replace(old, new, 1)

          old = '''            ffmpeg.setExecutable(true, false)
            val output = File(dir, "${videoFile.name.substringBeforeLast('.')}.webm")
            val libDir = ffmpeg.parentFile ?: File(context.applicationInfo.nativeLibraryDir)
'''
          new = '''            ffmpeg.setExecutable(true, false)
            // Never write the merged output over the downloaded video input.
            val output = File(dir, "merged.webm")
            val extractedLibDir = File(ffmpegRoot, "usr/lib")
            val libDir = if (extractedLibDir.isDirectory) extractedLibDir else (ffmpeg.parentFile ?: ffmpegRoot)
'''
          if old not in s:
              raise SystemExit('output/libDir block not found')
          s = s.replace(old, new, 1)

          old = '''            log("FFmpeg executable resolved: ${ffmpeg.absolutePath}")
            log("FFmpeg executable exists=${ffmpeg.exists()} executable=${ffmpeg.canExecute()} size=${ffmpeg.length()}")
            log("FFmpeg concat started")
'''
          new = '''            log("FFmpeg executable resolved: ${ffmpeg.absolutePath}")
            log("FFmpeg executable exists=${ffmpeg.exists()} executable=${ffmpeg.canExecute()} size=${ffmpeg.length()}")
            log("FFmpeg library directory: ${libDir.absolutePath}")
            log("FFmpeg library directory exists=${libDir.isDirectory}")
            if (libDir.isDirectory) {
                val libs = libDir.listFiles()?.filter { it.isFile && it.name.endsWith(".so") }?.take(20)?.joinToString(",") { it.name } ?: "<none>"
                log("FFmpeg bundled libraries: $libs")
            }
            log("FFmpeg concat started")
'''
          if old not in s:
              raise SystemExit('FFmpeg logging block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt
          git commit -m "Fix bundled FFmpeg runtime linking" || exit 0
          git push origin HEAD:youtube-quality-fallback

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-ffmpeg-runtime.yml || true
          git commit -m "Remove temporary FFmpeg runtime workflow" || true
          git push origin HEAD:youtube-quality-fallback || true
