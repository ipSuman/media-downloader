name: Apply save-before-merge fix

on:
  push:
    branches:
      - youtube-quality-fallback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch LocalEngineServer
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt')
          s = p.read_text()
          old = '            log("Video download completed: ${videoFile.name}")\n\n            log("Audio download started: format 251")'
          new = '            log("Video download completed: ${videoFile.name}")\n            val savedVideo = saveToDownloads(videoFile, videoFile.name)\n            log("Video file saved before merge: ${savedVideo.first}")\n\n            log("Audio download started: format 251")'
          if old not in s: raise SystemExit('video anchor not found')
          s = s.replace(old, new, 1)
          old = '            log("Audio 251 download completed: ${audioFile.name}")\n\n            log("Waiting 3 seconds before FFmpeg concat")'
          new = '            log("Audio 251 download completed: ${audioFile.name}")\n            val savedAudio = saveToDownloads(audioFile, audioFile.name)\n            log("Audio file saved before merge: ${savedAudio.first}")\n\n            log("Waiting 3 seconds before FFmpeg concat")'
          if old not in s: raise SystemExit('audio anchor not found')
          s = s.replace(old, new, 1)
          old = '            val env = processBuilder.environment()\n            val oldLd = env["LD_LIBRARY_PATH"]\n            env["LD_LIBRARY_PATH"] = if (oldLd.isNullOrBlank()) libDir.absolutePath else libDir.absolutePath + File.pathSeparator + oldLd'
          new = '            val env = processBuilder.environment()\n            val oldLd = env["LD_LIBRARY_PATH"]\n            val nativeLibDir = context.applicationInfo.nativeLibraryDir\n            val ffmpegLdParts = listOf(libDir.absolutePath, nativeLibDir).distinct()\n            val ffmpegLd = ffmpegLdParts.joinToString(File.pathSeparator)\n            env["LD_LIBRARY_PATH"] = if (oldLd.isNullOrBlank()) ffmpegLd else ffmpegLd + File.pathSeparator + oldLd\n            log("FFmpeg LD_LIBRARY_PATH: ${env["LD_LIBRARY_PATH"]}")'
          if old not in s: raise SystemExit('LD anchor not found')
          s = s.replace(old, new, 1)
          old = '    private fun guessMime(name: String): String {\n        return when (name.substringAfterLast(\'.\', "").lowercase(Locale.US)) {'
          new = '    private fun guessMime(name: String): String {\n        if (name.startsWith("audio.", ignoreCase = true)) return "audio/webm"\n        if (name.startsWith("video.", ignoreCase = true)) return "video/webm"\n        return when (name.substringAfterLast(\'.\', "").lowercase(Locale.US)) {'
          if old not in s: raise SystemExit('mime anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Verify
        run: |
          grep -n "Video file saved before merge\|Audio file saved before merge\|FFmpeg LD_LIBRARY_PATH" app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ipsuman/mediadownloader/LocalEngineServer.kt
          git commit -m "Save VP9 tracks before muxing"
          git rm .github/workflows/apply-save-before-merge.yml
          git commit -m "Remove temporary save-before-merge workflow"
          git push origin HEAD:youtube-quality-fallback
